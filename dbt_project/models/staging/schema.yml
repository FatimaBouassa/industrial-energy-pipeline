version: 2

models:
  - name: stg_intl_generation
    description: Annual electricity generation by country and product (BKWH), deduplicated.
    columns:
      - name: generation_key
        data_tests:
          - unique
          - not_null
      - name: country_code
        data_tests:
          - not_null
      - name: year
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null

  - name: stg_us_fuel_hourly
    description: Hourly US generation by balancing authority and fuel code, deduplicated.
    columns:
      - name: generation_key
        data_tests:
          - unique
          - not_null
      - name: hour_utc
        data_tests:
          - not_null
      - name: region_code
        data_tests:
          - not_null
      - name: fuel_code
        data_tests:
          - not_null
